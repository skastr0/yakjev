name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  native-graph:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test --package-path apps/mobile/modules/yakjev-graph
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - run: bash -n .agents/setup .agents/resume deploy/entrypoint.sh deploy/tests/resume.sh
      - name: Build deployment image (never publish or enroll)
        run: docker build -t yakjev:ci .
      - name: Fresh image refuses to run without deployment configuration
        run: |
          if docker run --rm yakjev:ci > /tmp/yakjev-rejection.log 2>&1; then
            echo 'Image unexpectedly started without configuration'
            exit 1
          fi
          grep -q 'YAKJEV_ORIGIN is required' /tmp/yakjev-rejection.log
