appId: dev.castro.yakjev
productName: Yakjev
directories:
  buildResources: build
  output: release
files:
  - out/**
  - "!**/*.map"
  - "!node_modules/**"
extraMetadata:
  main: out/main/index.js
asar: true
npmRebuild: false
mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icon.png
  target:
    - AppImage
  category: Office
dmg:
  writeUpdateInfo: false
publish: null
